# Render.com Infrastructure-as-Code Blueprint
# https://render.com/docs/blueprint-spec

databases:
  - name: teamflow-db
    plan: free
    databaseName: teamflow
    user: teamflow

services:
  - type: web
    name: teamflow-saas
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: teamflow-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false  # set manually after deploy
      - key: APP_URL
        sync: false  # set manually after deploy
    healthCheckPath: /health
