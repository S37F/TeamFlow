# Render.com — Web API (use Supabase for Postgres; Vercel for the SPA)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: teamflow-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "false"
      - key: REFRESH_COOKIE_SAME_SITE
        value: "none"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
